[project]
name = "forecast-agent"
version = "0.1.0"
description = "A tool-using actuarial forecasting agent"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
tracing = ["langfuse>=2.0"]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
package = false
